<!doctype html>
<html lang="es">
  <head>
    <script>
      // Idioma y modo de color se aplican antes del primer pintado, para que no parpadee.
      document.documentElement.lang = localStorage.getItem('locale') || 'es'
      try { if (localStorage.getItem('theme') === 'light') document.documentElement.classList.add('light') } catch (e) {}
    </script>
    <meta name="color-scheme" content="dark light" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=DM+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@100..800&family=Noto+Sans+SC:wght@300;400;500;700;800;900&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/beemarketbot-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="BeeMarketBot - Sistema de simulación de opinión en redes sociales" />
    <title>BeeMarketBot - Predice todo</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
