<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1120 680" xmlns="http://www.w3.org/2000/svg" font-family="DM Mono,monospace">
  <style>
    .flow { stroke-dasharray: 8 9; animation: dash 1.7s linear infinite; }
    .flow.slow { animation-duration: 2.8s; }
    @keyframes dash { to { stroke-dashoffset: -34; } }
    .pulse { animation: pulse 3s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: .72; } }
    .p2 { animation-delay: .5s; }
    .p3 { animation-delay: 1s; }
  </style>
  <defs>
    <linearGradient id="blue" x1="0" x2="1"><stop stop-color="#4689C8"/><stop offset="1" stop-color="#7FC4FF"/></linearGradient>
    <linearGradient id="purple" x1="0" x2="1"><stop stop-color="#761472"/><stop offset="1" stop-color="#C05AB8"/></linearGradient>
    <linearGradient id="green" x1="0" x2="1"><stop stop-color="#559E44"/><stop offset="1" stop-color="#8EDB70"/></linearGradient>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7FC4FF"/></marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#C05AB8"/></marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8EDB70"/></marker>
  </defs>

  <rect x="18" y="18" width="1084" height="644" rx="4" fill="#080B1C" stroke="#4689C8" stroke-opacity=".5"/>
  <text x="42" y="52" fill="#7FC4FF" font-size="12" letter-spacing="1.5">DOCKER COMPOSE · TRES SERVICIOS AISLADOS</text>
  <text x="1078" y="52" fill="#9CB8D4" font-size="10" text-anchor="end">red interna: beemarketbot_default</text>

  <!-- Cliente -->
  <rect x="42" y="80" width="210" height="72" fill="#111A36" stroke="#7FC4FF"/>
  <text x="147" y="108" fill="#F5F7FA" font-size="14" font-weight="700" text-anchor="middle">Navegador</text>
  <text x="147" y="130" fill="#BBD8F3" font-size="10" text-anchor="middle">Vue/Vite · :3000 / API :5001</text>

  <!-- API -->
  <rect x="42" y="188" width="416" height="374" rx="4" fill="#0D1228" stroke="url(#blue)" stroke-width="2"/>
  <rect x="42" y="188" width="416" height="48" fill="#172047"/>
  <text x="62" y="218" fill="#F5F7FA" font-size="16" font-weight="700">beemarketbot-api</text>
  <text x="438" y="217" fill="#7FC4FF" font-size="9" text-anchor="end">UI + API + simulación</text>

  <g class="pulse">
    <rect x="66" y="260" width="168" height="86" fill="#111A36" stroke="#7FC4FF"/>
    <text x="150" y="289" fill="#F5F7FA" font-size="12" font-weight="700" text-anchor="middle">Frontend + Flask</text>
    <text x="150" y="311" fill="#BBD8F3" font-size="9" text-anchor="middle">auth · proyectos · historial</text>
    <text x="150" y="328" fill="#BBD8F3" font-size="9" text-anchor="middle">progreso · configuración</text>
  </g>
  <g class="pulse p2">
    <rect x="258" y="260" width="176" height="86" fill="#111A36" stroke="#559E44"/>
    <text x="346" y="289" fill="#F5F7FA" font-size="12" font-weight="700" text-anchor="middle">Simulación</text>
    <text x="346" y="311" fill="#BDE8B1" font-size="9" text-anchor="middle">agentes · rondas · acciones</text>
    <text x="346" y="328" fill="#BDE8B1" font-size="9" text-anchor="middle">no espera a GraphRAG</text>
  </g>
  <rect x="66" y="374" width="168" height="110" fill="#111A36" stroke="#C05AB8"/>
  <text x="150" y="404" fill="#F5F7FA" font-size="12" font-weight="700" text-anchor="middle">Informes</text>
  <text x="150" y="426" fill="#E2B5DF" font-size="9" text-anchor="middle">agente · herramientas</text>
  <text x="150" y="443" fill="#E2B5DF" font-size="9" text-anchor="middle">interacción · español</text>
  <text x="150" y="460" fill="#E2B5DF" font-size="9" text-anchor="middle">lecturas GraphRAG</text>

  <rect x="258" y="374" width="176" height="110" fill="#111A36" stroke="#4689C8"/>
  <text x="346" y="404" fill="#F5F7FA" font-size="12" font-weight="700" text-anchor="middle">Cola durable</text>
  <text x="346" y="426" fill="#BBD8F3" font-size="9" text-anchor="middle">uploads/graphrag_queue</text>
  <text x="346" y="443" fill="#BBD8F3" font-size="9" text-anchor="middle">tareas · outbox · estados</text>
  <text x="346" y="460" fill="#BBD8F3" font-size="9" text-anchor="middle">recuperación tras reinicio</text>

  <!-- Worker -->
  <rect x="490" y="188" width="286" height="374" rx="4" fill="#0D1228" stroke="url(#purple)" stroke-width="2"/>
  <rect x="490" y="188" width="286" height="48" fill="#172047"/>
  <text x="510" y="211" fill="#F5F7FA" font-size="13" font-weight="700">beemarketbot-</text>
  <text x="510" y="227" fill="#F5F7FA" font-size="13" font-weight="700">graphrag-worker</text>
  <text x="756" y="217" fill="#E2B5DF" font-size="9" text-anchor="end">escrituras</text>

  <g class="pulse p3">
    <rect x="514" y="260" width="238" height="86" fill="#111A36" stroke="#C05AB8"/>
    <text x="633" y="289" fill="#F5F7FA" font-size="12" font-weight="700" text-anchor="middle">Construcción GraphRAG</text>
    <text x="633" y="311" fill="#E2B5DF" font-size="9" text-anchor="middle">chunks · ontología · lotes</text>
    <text x="633" y="328" fill="#E2B5DF" font-size="9" text-anchor="middle">LLM + embeddings</text>
  </g>
  <rect x="514" y="374" width="238" height="110" fill="#111A36" stroke="#761472"/>
  <text x="633" y="404" fill="#F5F7FA" font-size="12" font-weight="700" text-anchor="middle">Memoria episódica</text>
  <text x="633" y="426" fill="#E2B5DF" font-size="9" text-anchor="middle">actividades en lotes</text>
  <text x="633" y="443" fill="#E2B5DF" font-size="9" text-anchor="middle">journal antes de escribir</text>
  <text x="633" y="460" fill="#E2B5DF" font-size="9" text-anchor="middle">fallo aislado y visible</text>

  <!-- FalkorDB -->
  <rect x="808" y="188" width="270" height="374" rx="4" fill="#0D1228" stroke="url(#green)" stroke-width="2"/>
  <rect x="808" y="188" width="270" height="48" fill="#172047"/>
  <text x="828" y="218" fill="#F5F7FA" font-size="16" font-weight="700">falkordb</text>
  <text x="1058" y="217" fill="#BDE8B1" font-size="9" text-anchor="end">:6379</text>

  <rect x="832" y="260" width="222" height="86" fill="#111A36" stroke="#559E44"/>
  <text x="943" y="289" fill="#F5F7FA" font-size="12" font-weight="700" text-anchor="middle">Grafo persistente</text>
  <text x="943" y="311" fill="#BDE8B1" font-size="9" text-anchor="middle">entidades · relaciones</text>
  <text x="943" y="328" fill="#BDE8B1" font-size="9" text-anchor="middle">episodios · vectores</text>
  <rect x="832" y="374" width="222" height="110" fill="#111A36" stroke="#8EDB70"/>
  <text x="943" y="404" fill="#F5F7FA" font-size="12" font-weight="700" text-anchor="middle">Consultas GraphRAG</text>
  <text x="943" y="426" fill="#BDE8B1" font-size="9" text-anchor="middle">contexto para agentes</text>
  <text x="943" y="443" fill="#BDE8B1" font-size="9" text-anchor="middle">búsqueda semántica</text>
  <text x="943" y="460" fill="#BDE8B1" font-size="9" text-anchor="middle">volumen falkordb-data</text>

  <!-- Flujos -->
  <path class="flow" d="M147 152V178H150V188" fill="none" stroke="#7FC4FF" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <path class="flow" d="M434 429H480V303H490" fill="none" stroke="#C05AB8" stroke-width="2.3" marker-end="url(#arrowPurple)"/>
  <path class="flow slow" d="M776 303H808" fill="none" stroke="#8EDB70" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <path class="flow slow" d="M808 505H472V505H458" fill="none" stroke="#7FC4FF" stroke-width="1.8" marker-end="url(#arrowBlue)"/>

  <!-- Servicios externos -->
  <rect x="42" y="600" width="1036" height="34" fill="#111A36" stroke="#761472"/>
  <text x="560" y="621" fill="#E2B5DF" font-size="10" text-anchor="middle">SERVICIOS EXTERNOS · proveedor LLM · proveedor de embeddings · HTTPS</text>
  <path class="flow slow" d="M633 562V590" fill="none" stroke="#C05AB8" stroke-width="2" marker-end="url(#arrowPurple)"/>
</svg>
