<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1120 620" xmlns="http://www.w3.org/2000/svg" font-family="DM Mono,monospace"><style>
.flow { stroke-dasharray: 8 9; animation: dash 1.7s linear infinite; }
.flow.slow { animation-duration: 2.8s; }
@keyframes dash { to { stroke-dashoffset: -32; } }
.pulse { animation: pulse 3s ease-in-out infinite; }
.p2 { animation-delay: .4s; } .p3 { animation-delay: .8s; }
.p4 { animation-delay: 1.2s; } .p5 { animation-delay: 1.6s; }
</style>
        <defs>
          <linearGradient id="containerBlue" x1="0" x2="1"><stop stop-color="#4689C8"/><stop offset="1" stop-color="#7FC4FF"/></linearGradient>
          <linearGradient id="containerPurple" x1="0" x2="1"><stop stop-color="#761472"/><stop offset="1" stop-color="#C05AB8"/></linearGradient>
          <linearGradient id="containerGreen" x1="0" x2="1"><stop stop-color="#559E44"/><stop offset="1" stop-color="#8EDB70"/></linearGradient>
          <marker id="containerArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7FC4FF"/></marker>
        </defs>

        <rect x="18" y="18" width="1084" height="584" rx="4" fill="#080B1C" stroke="#4689C8" stroke-opacity=".5"/>
        <text x="42" y="52" fill="#7FC4FF" font-size="12" letter-spacing="1.5">DOCKER COMPOSE · SERVICIOS EN EJECUCIÓN</text>
        <text x="1078" y="52" fill="#9CB8D4" font-size="10" text-anchor="end">red interna: beemarketbot_default</text>

        <!-- Cliente fuera de Docker -->
        <rect x="42" y="86" width="180" height="74" fill="#111A36" stroke="#7FC4FF"/>
        <text x="132" y="115" fill="#F5F7FA" font-size="14" font-weight="700" text-anchor="middle">Navegador</text>
        <text x="132" y="137" fill="#BBD8F3" font-size="11" text-anchor="middle">usuario · Vue/Vite</text>
        <text x="132" y="151" fill="#7FC4FF" font-size="9" text-anchor="middle">:3000 / :5001</text>

        <!-- Contenedor principal -->
        <rect x="42" y="198" width="650" height="350" rx="4" fill="#0D1228" stroke="url(#containerBlue)" stroke-width="2"/>
        <rect x="42" y="198" width="650" height="48" fill="#172047"/>
        <text x="66" y="228" fill="#F5F7FA" font-size="17" font-weight="700">beemarketbot</text>
        <text x="670" y="227" fill="#7FC4FF" font-size="10" text-anchor="end">API + simulación + GraphRAG</text>

        <g class="pulse">
          <rect x="66" y="270" width="180" height="86" fill="#111A36" stroke="#7FC4FF"/>
          <text x="156" y="298" fill="#F5F7FA" font-size="13" font-weight="700" text-anchor="middle">Frontend Vue/Vite</text>
          <text x="156" y="320" fill="#BBD8F3" font-size="10" text-anchor="middle">proyectos · historial</text>
          <text x="156" y="337" fill="#BBD8F3" font-size="10" text-anchor="middle">progreso · informes</text>
        </g>
        <g class="pulse p2">
          <rect x="274" y="270" width="180" height="86" fill="#111A36" stroke="#D71343"/>
          <text x="364" y="298" fill="#F5F7FA" font-size="13" font-weight="700" text-anchor="middle">Backend Flask</text>
          <text x="364" y="320" fill="#F3B3C2" font-size="10" text-anchor="middle">API · tareas · auth</text>
          <text x="364" y="337" fill="#F3B3C2" font-size="10" text-anchor="middle">idioma · persistencia</text>
        </g>
        <g class="pulse p3">
          <rect x="482" y="270" width="180" height="86" fill="#111A36" stroke="#559E44"/>
          <text x="572" y="298" fill="#F5F7FA" font-size="13" font-weight="700" text-anchor="middle">Simulación</text>
          <text x="572" y="320" fill="#BDE8B1" font-size="10" text-anchor="middle">agentes · rondas</text>
          <text x="572" y="337" fill="#BDE8B1" font-size="10" text-anchor="middle">acciones · escenarios</text>
        </g>

        <rect x="66" y="390" width="180" height="112" fill="#111A36" stroke="#761472"/>
        <text x="156" y="418" fill="#F5F7FA" font-size="13" font-weight="700" text-anchor="middle">GraphRAG</text>
        <text x="156" y="440" fill="#E2B5DF" font-size="10" text-anchor="middle">ontología · chunks</text>
        <text x="156" y="457" fill="#E2B5DF" font-size="10" text-anchor="middle">workers · lotes</text>
        <text x="156" y="474" fill="#E2B5DF" font-size="10" text-anchor="middle">memoria episódica</text>

        <rect x="274" y="390" width="180" height="112" fill="#111A36" stroke="#C05AB8"/>
        <text x="364" y="418" fill="#F5F7FA" font-size="13" font-weight="700" text-anchor="middle">Agentes y reportes</text>
        <text x="364" y="440" fill="#E2B5DF" font-size="10" text-anchor="middle">perfiles · prompts</text>
        <text x="364" y="457" fill="#E2B5DF" font-size="10" text-anchor="middle">informe · interacción</text>
        <text x="364" y="474" fill="#E2B5DF" font-size="10" text-anchor="middle">salida en español</text>

        <rect x="482" y="390" width="180" height="112" fill="#111A36" stroke="#4689C8"/>
        <text x="572" y="418" fill="#F5F7FA" font-size="13" font-weight="700" text-anchor="middle">Almacenamiento</text>
        <text x="572" y="440" fill="#BBD8F3" font-size="10" text-anchor="middle">uploads/projects</text>
        <text x="572" y="457" fill="#BBD8F3" font-size="10" text-anchor="middle">tareas · informes</text>
        <text x="572" y="474" fill="#BBD8F3" font-size="10" text-anchor="middle">volumen persistente</text>

        <!-- Conexiones internas -->
        <path class="flow" d="M246 313H274" stroke="#7FC4FF" stroke-width="2" marker-end="url(#containerArrow)"/>
        <path class="flow" d="M454 313H482" stroke="#7FC4FF" stroke-width="2" marker-end="url(#containerArrow)"/>
        <path class="flow slow" d="M364 356V390" stroke="#D71343" stroke-width="2" marker-end="url(#containerArrow)"/>
        <path class="flow slow" d="M572 356V390" stroke="#559E44" stroke-width="2" marker-end="url(#containerArrow)"/>

        <!-- FalkorDB -->
        <rect x="728" y="198" width="350" height="350" rx="4" fill="#0D1228" stroke="url(#containerGreen)" stroke-width="2"/>
        <rect x="728" y="198" width="350" height="48" fill="#172047"/>
        <text x="752" y="228" fill="#F5F7FA" font-size="17" font-weight="700">falkordb</text>
        <text x="1054" y="227" fill="#BDE8B1" font-size="10" text-anchor="end">grafo · Redis :6379</text>

        <rect x="752" y="270" width="302" height="86" fill="#111A36" stroke="#559E44"/>
        <text x="903" y="298" fill="#F5F7FA" font-size="13" font-weight="700" text-anchor="middle">Memoria del grafo</text>
        <text x="903" y="320" fill="#BDE8B1" font-size="10" text-anchor="middle">nodos · entidades</text>
        <text x="903" y="337" fill="#BDE8B1" font-size="10" text-anchor="middle">relaciones · episodios</text>

        <rect x="752" y="390" width="302" height="112" fill="#111A36" stroke="#8EDB70"/>
        <text x="903" y="418" fill="#F5F7FA" font-size="13" font-weight="700" text-anchor="middle">Consultas GraphRAG</text>
        <text x="903" y="440" fill="#BDE8B1" font-size="10" text-anchor="middle">contexto para agentes</text>
        <text x="903" y="457" fill="#BDE8B1" font-size="10" text-anchor="middle">búsqueda semántica</text>
        <text x="903" y="474" fill="#BDE8B1" font-size="10" text-anchor="middle">persistencia independiente</text>

        <path class="flow slow" d="M692 430H752" stroke="#559E44" stroke-width="2.5" marker-end="url(#containerArrow)"/>
        <path class="flow slow" d="M903 356V390" stroke="#559E44" stroke-width="2" marker-end="url(#containerArrow)"/>

        <!-- Servicios externos -->
        <rect x="42" y="570" width="1036" height="20" fill="#111A36" stroke="#761472"/>
        <text x="560" y="584" fill="#E2B5DF" font-size="10" text-anchor="middle">SERVICIOS EXTERNOS: proveedor LLM · proveedor de embeddings · acceso vía HTTPS</text>
        <path class="flow slow" d="M560 548V570" stroke="#C05AB8" stroke-width="2" marker-end="url(#containerArrow)"/>
      </svg>
